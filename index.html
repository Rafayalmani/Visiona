<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visiona AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        /* Core palette — deep charcoal, not pure black */
        --bg: #0c0e14;
        --sidebar-bg: #0e1018;
        --surface: #161921;
        --surface-2: #1d2030;
        --surface-3: #252840;

        /* Borders */
        --border: rgba(255, 255, 255, 0.055);
        --border-md: rgba(255, 255, 255, 0.09);
        --border-lg: rgba(255, 255, 255, 0.13);

        /* Brand — warm electric indigo */
        --brand: #7c6dfa;
        --brand-2: #5b8dee;
        --brand-glow: rgba(124, 109, 250, 0.18);
        --brand-soft: rgba(124, 109, 250, 0.08);

        /* Semantic */
        --green: #3ecf8e;
        --orange: #f59e0b;
        --red: #f87171;

        /* Text */
        --text: #e8eaf2;
        --text-2: #8b8fa8;
        --text-3: #4a4e66;

        /* Bubbles */
        --user-bg: #1a1d30;
        --user-border: rgba(91, 141, 238, 0.18);
        --bot-bg: #161921;
        --bot-border: rgba(255, 255, 255, 0.055);

        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 18px;
        --radius-xl: 24px;

        --sidebar-w: 256px;
        --trans: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

        --font: "Geist", -apple-system, sans-serif;
        --mono: "Geist Mono", monospace;
      }

      html, body { height: 100%; overflow: hidden; }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        display: flex;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        font-size: 16px; /* mobile friendly */
      }

      /* ═══════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════ */
      .sidebar {
        width: var(--sidebar-w);
        min-width: var(--sidebar-w);
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        height: 100vh;
        z-index: 200;
        flex-shrink: 0;
        transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Logo */
      .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 16px 14px;
        border-bottom: 1px solid var(--border);
      }

      .logo-mark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        flex-shrink: 0;
        box-shadow:
          0 0 0 1px rgba(124, 109, 250, 0.3),
          0 4px 16px rgba(124, 109, 250, 0.25);
      }

      .logo-wordmark {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text);
      }
      .logo-wordmark span {
        color: var(--brand);
      }

      /* New chat */
      .new-chat-btn {
        margin: 10px 10px 6px;
        padding: 9px 14px;
        background: var(--surface);
        border: 1px solid var(--border-md);
        border-radius: var(--radius-md);
        color: var(--text-2);
        font-family: var(--font);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: var(--trans);
        width: calc(100% - 20px);
      }
      .new-chat-btn:hover {
        background: var(--surface-2);
        border-color: var(--border-lg);
        color: var(--text);
      }
      .new-chat-btn svg {
        opacity: 0.5;
        flex-shrink: 0;
      }
      .new-chat-btn:hover svg {
        opacity: 1;
      }

      /* History */
      .sidebar-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-3);
        padding: 10px 16px 4px;
      }

      .chat-history {
        flex: 1;
        overflow-y: auto;
        padding: 2px 8px 8px;
      }
      .chat-history::-webkit-scrollbar {
        width: 3px;
      }
      .chat-history::-webkit-scrollbar-thumb {
        background: var(--border-md);
        border-radius: 3px;
      }

      .history-item {
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 12.5px;
        color: var(--text-2);
        transition: var(--trans);
        display: flex;
        align-items: center;
        gap: 8px;
        position: relative;
        overflow: hidden;
      }
      .history-item:hover {
        background: var(--surface);
        color: var(--text);
      }
      .history-item.active {
        background: var(--surface);
        color: var(--text);
      }
      .history-item .h-ico {
        font-size: 12px;
        flex-shrink: 0;
        opacity: 0.45;
      }
      .history-item .h-txt {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .history-item .h-del {
        display: none;
        background: none;
        border: none;
        color: var(--text-3);
        cursor: pointer;
        font-size: 11px;
        padding: 2px 5px;
        border-radius: 4px;
        flex-shrink: 0;
        transition: var(--trans);
      }
      .history-item:hover .h-del {
        display: flex;
      }
      .history-item .h-del:hover {
        color: var(--red);
        background: rgba(248, 113, 113, 0.08);
      }

      /* Footer */
      .sidebar-footer {
        padding: 10px;
        border-top: 1px solid var(--border);
      }

      .founder-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
        background: var(--surface);
        border: 1px solid var(--border-md);
        border-radius: var(--radius-md);
        text-decoration: none;
        transition: var(--trans);
      }
      .founder-card:hover {
        border-color: rgba(124, 109, 250, 0.3);
        background: var(--surface-2);
      }

      .founder-av {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: white;
        flex-shrink: 0;
      }
      .founder-meta {
        flex: 1;
        overflow: hidden;
      }
      .founder-name {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .founder-role {
        font-size: 10px;
        color: var(--text-3);
        margin-top: 1px;
      }

      /* ═══════════════════════════════════════
   MAIN
═══════════════════════════════════════ */
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        min-width: 0;
        position: relative;
      }

      /* Subtle grid texture on bg */
      .main::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(124, 109, 250, 0.025) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(124, 109, 250, 0.025) 1px,
            transparent 1px
          );
        background-size: 48px 48px;
        mask-image: radial-gradient(
          ellipse 80% 60% at 50% 0%,
          black,
          transparent
        );
      }

      /* ═══════════════════════════════════════
   TOPBAR
═══════════════════════════════════════ */
      .topbar {
        height: 52px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        flex-shrink: 0;
        background: rgba(12, 14, 20, 0.85);
        backdrop-filter: blur(16px);
        position: relative;
        z-index: 10;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .menu-btn {
        display: none;
        width: 32px;
        height: 32px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-md);
        background: var(--surface);
        color: var(--text-2);
        cursor: pointer;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        transition: var(--trans);
      }
      .menu-btn:hover {
        color: var(--text);
        border-color: var(--border-lg);
      }

      .status-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--surface);
        border: 1px solid var(--border-md);
        border-radius: 100px;
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-2);
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 6px var(--green);
        animation: statusPulse 2.5s ease-in-out infinite;
      }
      @keyframes statusPulse {
        0%,
        100% {
          opacity: 1;
          box-shadow: 0 0 6px var(--green);
        }
        50% {
          opacity: 0.5;
          box-shadow: 0 0 12px var(--green);
        }
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .tb-btn {
        padding: 5px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-3);
        font-family: var(--font);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: var(--trans);
      }
      .tb-btn:hover {
        border-color: rgba(248, 113, 113, 0.3);
        color: var(--red);
        background: rgba(248, 113, 113, 0.05);
      }

      /* ═══════════════════════════════════════
   MESSAGES
═══════════════════════════════════════ */
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 28px 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        scroll-behavior: smooth;
        position: relative;
        z-index: 1;
      }
      .messages::-webkit-scrollbar {
        width: 4px;
      }
      .messages::-webkit-scrollbar-track {
        background: transparent;
      }
      .messages::-webkit-scrollbar-thumb {
        background: var(--border-md);
        border-radius: 4px;
      }

      /* ── Welcome ── */
      .welcome {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        min-height: 55vh;
        text-align: center;
        padding: 32px 20px;
        animation: fadeUp 0.45s ease both;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .welcome-glyph {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: linear-gradient(145deg, var(--surface-2), var(--surface-3));
        border: 1px solid var(--border-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-bottom: 20px;
        box-shadow:
          0 0 0 1px var(--border),
          0 8px 32px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        animation: glyphFloat 4s ease-in-out infinite;
      }
      @keyframes glyphFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-7px);
        }
      }

      .welcome h2 {
        font-size: clamp(20px, 3.5vw, 28px);
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--text);
        margin-bottom: 8px;
        line-height: 1.2;
      }
      .welcome h2 em {
        font-style: normal;
        background: linear-gradient(
          135deg,
          var(--brand) 0%,
          var(--brand-2) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .welcome-sub {
        font-size: 14px;
        color: var(--text-2);
        max-width: 380px;
        line-height: 1.65;
        margin-bottom: 28px;
      }

      .welcome-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        max-width: 500px;
        width: 100%;
      }

      .wcard {
        background: var(--surface);
        border: 1px solid var(--border-md);
        border-radius: var(--radius-md);
        padding: 11px 14px;
        cursor: pointer;
        text-align: left;
        transition: var(--trans);
        font-family: var(--font);
      }
      .wcard:hover {
        background: var(--surface-2);
        border-color: rgba(124, 109, 250, 0.3);
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      }
      .wcard-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text);
        line-height: 1.4;
        margin-bottom: 3px;
      }
      .wcard-sub {
        font-size: 11px;
        color: var(--text-3);
      }

      /* ── Message rows ── */
      .msg-row {
        display: flex;
        gap: 10px;
        padding: 6px 0;
        max-width: 760px;
        margin: 0 auto;
        width: 100%;
        animation: msgIn 0.25s cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      @keyframes msgIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .msg-row.user {
        flex-direction: row-reverse;
      }

      .msg-av {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        align-self: flex-start;
        margin-top: 3px;
      }
      .msg-row.user .msg-av {
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        color: white;
        font-size: 11px;
        font-weight: 700;
      }
      .msg-row.bot .msg-av {
        background: var(--surface-2);
        border: 1px solid var(--border-md);
        color: var(--brand);
        font-size: 12px;
      }

      .msg-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .msg-row.user .msg-body {
        align-items: flex-end;
      }
      .msg-row.bot .msg-body {
        align-items: flex-start;
      }

      .msg-sender {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-3);
        padding: 0 2px;
      }

      /* Text bubble */
      .msg-bubble {
        padding: 11px 15px;
        border-radius: var(--radius-lg);
        font-size: 14.5px;
        line-height: 1.7;
        word-break: break-word;
        white-space: pre-wrap;
        max-width: min(100%, 600px);
      }
      .msg-row.user .msg-bubble {
        background: var(--user-bg);
        border: 1px solid var(--user-border);
        color: var(--text);
        border-top-right-radius: 4px;
      }
      .msg-row.bot .msg-bubble {
        background: var(--bot-bg);
        border: 1px solid var(--bot-border);
        color: var(--text);
        border-top-left-radius: 4px;
      }

      /* Image bubble */
      .img-bubble {
        background: var(--surface);
        border: 1px solid var(--border-md);
        border-radius: var(--radius-lg);
        border-top-left-radius: 4px;
        overflow: hidden;
        max-width: min(380px, 100%);
      }
      .img-bubble img {
        width: 100%;
        display: block;
        opacity: 0;
        transition: opacity 0.45s ease;
        max-height: 380px;
        object-fit: cover;
        cursor: pointer;
      }
      .img-bubble img.loaded {
        opacity: 1;
      }
      .img-bubble-bar {
        padding: 9px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-top: 1px solid var(--border);
        background: var(--surface-2);
      }
      .img-prompt-text {
        font-size: 11px;
        color: var(--text-3);
        font-family: var(--mono);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .img-save-btn {
        background: var(--brand-soft);
        border: 1px solid rgba(124, 109, 250, 0.2);
        color: var(--brand);
        border-radius: 6px;
        padding: 3px 9px;
        font-size: 11px;
        font-weight: 600;
        font-family: var(--font);
        cursor: pointer;
        transition: var(--trans);
        flex-shrink: 0;
      }
      .img-save-btn:hover {
        background: rgba(124, 109, 250, 0.16);
      }

      /* Detect badge */
      .detect-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--brand-soft);
        border: 1px solid rgba(124, 109, 250, 0.15);
        border-radius: 100px;
        padding: 5px 12px;
        font-size: 12px;
        color: var(--brand);
        font-weight: 500;
      }
      .d-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--brand);
        animation: statusPulse 1s ease-in-out infinite;
      }

      /* Typing */
      .typing-bubble {
        background: var(--bot-bg);
        border: 1px solid var(--bot-border);
        border-radius: var(--radius-lg);
        border-top-left-radius: 4px;
        padding: 14px 16px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .t-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--brand);
        animation: tdot 1.1s ease-in-out infinite;
      }
      .t-dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .t-dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes tdot {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.25;
        }
        30% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }

      /* Message actions */
      .msg-actions {
        display: flex;
        gap: 4px;
        opacity: 0;
        transition: opacity 0.15s;
        margin-top: 2px;
      }
      .msg-row:hover .msg-actions {
        opacity: 1;
      }
      .msg-act {
        background: var(--surface);
        border: 1px solid var(--border-md);
        color: var(--text-3);
        border-radius: 5px;
        padding: 3px 8px;
        font-size: 11px;
        font-weight: 500;
        font-family: var(--font);
        cursor: pointer;
        transition: var(--trans);
      }
      .msg-act:hover {
        color: var(--text);
        border-color: var(--border-lg);
        background: var(--surface-2);
      }

      /* ═══════════════════════════════════════
   INPUT AREA
═══════════════════════════════════════ */
      .input-area {
        padding: 12px 20px 16px;
        flex-shrink: 0;
        background: rgba(12, 14, 20, 0.92);
        backdrop-filter: blur(16px);
        border-top: 1px solid var(--border);
        position: relative;
        z-index: 10;
      }

      .input-shell {
        max-width: 760px;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--border-md);
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        overflow: hidden;
      }
      .input-shell:focus-within {
        border-color: rgba(124, 109, 250, 0.4);
        box-shadow:
          0 0 0 3px rgba(124, 109, 250, 0.07),
          0 4px 24px rgba(0, 0, 0, 0.35);
      }

      #msgInput {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        resize: none;
        font-family: var(--font);
        font-size: 14.5px;
        color: var(--text);
        padding: 14px 16px 0;
        line-height: 1.6;
        max-height: 160px;
        overflow-y: auto;
        min-height: 48px;
        caret-color: var(--brand);
      }
      #msgInput::placeholder {
        color: var(--text-3);
      }
      #msgInput::-webkit-scrollbar {
        width: 3px;
      }
      #msgInput::-webkit-scrollbar-thumb {
        background: var(--border-md);
      }

      .input-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px 10px 16px;
      }

      .input-caps {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .cap-chip {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.03em;
        color: var(--text-3);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 100px;
        padding: 2px 8px;
      }
      .cap-chip .cap-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
      }
      .cap-dot.img {
        background: var(--orange);
      }
      .cap-dot.txt {
        background: var(--green);
      }
      .cap-dot.ai {
        background: var(--brand);
      }

      .send-btn {
        width: 34px;
        height: 34px;

      /* ══════════════════════════════
   CONFIG
══════════════════════════════ */
      const API_KEY = "sk_KdVQD7TO5iEBCNjOkyXdTdS8zPJfjssm";
      const IMG_API = "https://gen.pollinations.ai/image";
      const TEXT_API = "https://gen.pollinations.ai/text";
      const STORE_KEY = "visiona_sessions";
      const CUR_KEY = "visiona_current";

      /* ══════════════════════════════
   STATE
══════════════════════════════ */
      let busy = false;
      let currentId = null;
      let sessions = {};

      /* ══════════════════════════════
   INIT
══════════════════════════════ */
      (function init() {
        try {
          sessions = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
        } catch (e) {
          sessions = {};
        }
        const cur = localStorage.getItem(CUR_KEY);
        if (cur && sessions[cur]) {
          currentId = cur;
          loadSession(cur);
        }
        renderHistory();
      })();

      /* ══════════════════════════════
   SESSIONS
══════════════════════════════ */
      function save() {
        localStorage.setItem(STORE_KEY, JSON.stringify(sessions));
        localStorage.setItem(CUR_KEY, currentId || "");
      }

      function newChat() {
        currentId = null;
        const m = document.getElementById("messages");
        m.innerHTML = "";
        m.appendChild(buildWelcome());
        save();
        renderHistory();
        closeSidebar();
        document.getElementById("msgInput").focus();
      }

      function loadSession(id) {
        currentId = id;
        const m = document.getElementById("messages");
        m.innerHTML = "";
        const s = sessions[id];
        if (!s || !s.messages.length) {
          m.appendChild(buildWelcome());
          return;
        }
        s.messages.forEach((msg) => renderMessage(msg, false));
        scrollBottom();
      }

      function ensureSession(firstMsg) {
        if (!currentId) {
          currentId = Date.now().toString();
          sessions[currentId] = {
            title: firstMsg.slice(0, 40) + (firstMsg.length > 40 ? "…" : ""),
            messages: [],
          };
        }
      }

      function addToSession(msgObj) {
        if (!currentId) return;
        sessions[currentId].messages.push(msgObj);
        save();
      }

      function renderHistory() {
        const el = document.getElementById("chatHistory");
        el.innerHTML = "";
        const ids = Object.keys(sessions).sort((a, b) => b - a);
        if (!ids.length) {
          el.innerHTML =
            '<div style="padding:10px 14px;font-size:12px;color:var(--text-3);font-style:italic;">No conversations yet</div>';
          return;
        }
        ids.forEach((id) => {
          const s = sessions[id];
          const div = document.createElement("div");
          div.className = "history-item" + (id === currentId ? " active" : "");
          div.innerHTML = `<span class="h-ico">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 2.5C1 1.67 1.67 1 2.5 1h7c.83 0 1.5.67 1.5 1.5v6C11 9.33 10.33 10 9.5 10H7l-2 1.5V10H2.5C1.67 10 1 9.33 1 8.5v-6z" stroke="currentColor" stroke-width="1.2"/></svg>
    </span><span class="h-txt">${escHtml(s.title)}</span><button class="h-del" onclick="deleteSession(event,'${id}')">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 2l6 6M8 2L2 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>`;
          div.addEventListener("click", () => {
            currentId = id;
            loadSession(id);
            renderHistory();
            closeSidebar();
          });
          el.appendChild(div);
        });
      }

      function deleteSession(e, id) {
        e.stopPropagation();
        delete sessions[id];
        if (currentId === id) {
          currentId = null;
          newChat();
        }
        save();
        renderHistory();
        showToast("Conversation deleted");
      }

      /* ══════════════════════════════
   WELCOME
══════════════════════════════ */
      function buildWelcome() {
        const w = document.createElement("div");
        w.id = "welcome";
        w.className = "welcome";
        w.innerHTML = `
    <div class="welcome-glyph">✦</div>
    <h2>Hello, I'm <em>Visiona AI</em></h2>
    <p class="welcome-sub">Chat with me, ask anything, or say "generate an image of…" — I'll automatically figure out what you need.</p>
    <div class="welcome-grid">
      <button class="wcard" onclick="useChip(this)"><div class="wcard-label">🎨 Cyberpunk city at night</div><div class="wcard-sub">Generate image</div></button>
      <button class="wcard" onclick="useChip(this)"><div class="wcard-label">💬 How do black holes form?</div><div class="wcard-sub">Ask anything</div></button>
      <button class="wcard" onclick="useChip(this)"><div class="wcard-label">🖼 Samurai in neon rain</div><div class="wcard-sub">Generate image</div></button>
      <button class="wcard" onclick="useChip(this)"><div class="wcard-label">✍️ Poem about the ocean</div><div class="wcard-sub">Write something</div></button>
      <button class="wcard" onclick="useChip(this)"><div class="wcard-label">🚀 Best way to learn coding?</div><div class="wcard-sub">Get advice</div></button>
      <button class="wcard" onclick="useChip(this)"><div class="wcard-label">🌸 Cherry blossoms watercolor</div><div class="wcard-sub">Generate image</div></button>
    </div>`;
        return w;
      }

      function useChip(el) {
        const lbl = el.querySelector(".wcard-label");
        const txt = (lbl ? lbl.textContent : el.textContent)
          .replace(/^[\p{Emoji}\s]+/u, "")
          .trim();
        document.getElementById("msgInput").value = txt;
        send();
      }

      /* ══════════════════════════════
   RENDER MESSAGE
══════════════════════════════ */
      function renderMessage(msgObj, animate = true) {
        const w = document.getElementById("welcome");
        if (w) w.remove();

        const row = document.createElement("div");
        row.className = "msg-row " + msgObj.role;
        if (!animate) row.style.animation = "none";

        // Avatar
        const av = document.createElement("div");
        av.className = "msg-av";
        av.textContent = msgObj.role === "user" ? "U" : "✦";

        // Body
        const body = document.createElement("div");
        body.className = "msg-body";

        const sender = document.createElement("div");
        sender.className = "msg-sender";
        sender.textContent = msgObj.role === "user" ? "You" : "Visiona AI";
        body.appendChild(sender);

        if (msgObj.type === "detect") {
          const badge = document.createElement("div");
          badge.className = "detect-badge";
          badge.innerHTML = '<span class="d-dot"></span> Analyzing…';
          body.appendChild(badge);
        } else if (msgObj.type === "image") {
          const ib = document.createElement("div");
          ib.className = "img-bubble";
          const img = document.createElement("img");
          img.src = msgObj.content;
          img.alt = msgObj.prompt || "Generated image";
          img.onclick = () => openModal(img.src);
          img.onload = () => {
            img.classList.add("loaded");
            scrollBottom();
          };
          const bar = document.createElement("div");
          bar.className = "img-bubble-bar";
          const pt = document.createElement("div");
          pt.className = "img-prompt-text";
          pt.textContent = '"' + (msgObj.prompt || "") + '"';
          const dl = document.createElement("button");
          dl.className = "img-save-btn";
          dl.textContent = "↓ Save";
          dl.onclick = () => downloadImg(msgObj.content);
          bar.appendChild(pt);
          bar.appendChild(dl);
          ib.appendChild(img);
          ib.appendChild(bar);
          body.appendChild(ib);
        } else {
          const bubble = document.createElement("div");
          bubble.className = "msg-bubble";
          if (
            animate &&
            msgObj.role === "bot" &&
            msgObj.content.length < 1500
          ) {
            animateText(bubble, msgObj.content);
          } else {
            bubble.textContent = msgObj.content;
          }
          body.appendChild(bubble);
          if (msgObj.role === "bot") {
            const acts = document.createElement("div");
            acts.className = "msg-actions";
            const cp = document.createElement("button");
            cp.className = "msg-act";
            cp.textContent = "Copy";
            cp.onclick = () =>
              navigator.clipboard
                .writeText(msgObj.content)
                .then(() => showToast("Copied to clipboard"));
            acts.appendChild(cp);
            body.appendChild(acts);
          }
        }

        row.appendChild(av);
        row.appendChild(body);
        document.getElementById("messages").appendChild(row);
        scrollBottom();
        return row;
      }

      function animateText(el, text) {
        el.textContent = "";
        let i = 0;
        function step() {
          if (i < text.length) {
            el.textContent += text.slice(i, i + 4);
            i += 4;
            scrollBottom();
            setTimeout(step, 10);
          }
        }
        step();
      }

      /* ══════════════════════════════
   TYPING
══════════════════════════════ */
      function showTyping() {
        const row = document.createElement("div");
        row.className = "msg-row bot";
        row.id = "typing-row";
        const av = document.createElement("div");
        av.className = "msg-av";
        av.textContent = "✦";
        const body = document.createElement("div");
        body.className = "msg-body";
        const s = document.createElement("div");
        s.className = "msg-sender";
        s.textContent = "Visiona AI";
        const bub = document.createElement("div");
        bub.className = "typing-bubble";
        bub.innerHTML =
          '<div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>';
        body.appendChild(s);
        body.appendChild(bub);
        row.appendChild(av);
        row.appendChild(body);
        document.getElementById("messages").appendChild(row);
        scrollBottom();
      }
      function hideTyping() {
        const t = document.getElementById("typing-row");
        if (t) t.remove();
      }

      /* ══════════════════════════════
   AUTO-DETECT
══════════════════════════════ */
      async function detectIntent(userMsg) {
        const lower = userMsg.toLowerCase();
        const imageKw = [
          "generate",
          "create",
          "make",
          "draw",
          "paint",
          "image",
          "picture",
          "photo",
          "illustration",
          "portrait",
          "render",
          "design a",
          "art of",
          "artwork",
          "scene of",
          "landscape",
          "watercolor",
          "realistic",
          "cinematic",
          "wallpaper",
          "poster",
          "logo",
          "thumbnail",
          "anime",
          "cartoon",
          "3d render",
          "oil painting",
          "show me a",
          "visualize",
          "sketch",
          "pixel art",
          "concept art",
        ];
        if (imageKw.some((k) => lower.includes(k))) return "IMAGE";

        try {
          const q =
            "Reply ONE word only: IMAGE or CHAT. Does this want an image generated? Message: " +
            userMsg;
          const res = await fetch(
            `${TEXT_API}/${encodeURIComponent(q)}?model=gemini-fast&seed=42&key=${API_KEY}`,
          );
          if (!res.ok) throw new Error("fail");
          const txt = (await res.text()).trim().toUpperCase();
          if (txt.includes("IMAGE")) return "IMAGE";
        } catch (e) {}
        return "CHAT";
      }

      /* ══════════════════════════════
   GENERATE IMAGE
══════════════════════════════ */
      async function generateImage(prompt) {
        return `${IMG_API}/${encodeURIComponent(prompt)}?model=zimage&width=1024&height=1024&seed=${Math.floor(Math.random() * 99999)}&enhance=false&key=${API_KEY}`;
      }

      /* ══════════════════════════════
   CHAT REPLY
══════════════════════════════ */
  async function chatReply(userMsg){
  
  const s = sessions[currentId];
  const history = (s ? s.messages : [])
    .filter(m => m.type==='text' && (m.role==='user' || m.role==='bot'))
    .slice(-10);

  let ctx = 'You are Visiona AI, a helpful assistant by Rafay Almani. Be concise and warm.';
  history.forEach(m => {
    ctx += (m.role==='user' ? 'User: ' : 'Assistant: ') + m.content + '';
  });
  ctx += 'User: ' + userMsg + 'Assistant:';

  const res = await fetch(`${TEXT_API}/${encodeURIComponent(ctx)}?model=gemini-fast&seed=${Math.floor(Math.random()*99999)}&key=${API_KEY}`);
  if(!res.ok) throw new Error('API error ' + res.status);
  return (await res.text()).trim();
}

      /* ══════════════════════════════
   SEND
══════════════════════════════ */
      async function send() {
        const inp = document.getElementById("msgInput");
        const msg = inp.value.trim();
        if (!msg || busy) return;

        busy = true;
        document.getElementById("sendBtn").disabled = true;
        inp.value = "";
        inp.style.height = "auto";

        ensureSession(msg);
        renderHistory();
        const uObj = { role: "user", type: "text", content: msg };
        renderMessage(uObj);
        addToSession(uObj);

        const dObj = { role: "bot", type: "detect", content: "" };
        const dRow = renderMessage(dObj);

        try {
          const intent = await detectIntent(msg);
          dRow.remove();

          if (intent === "IMAGE") {
            showTyping();
            const url = await generateImage(msg);
            hideTyping();
            const iObj = {
              role: "bot",
              type: "image",
              content: url,
              prompt: msg,
            };
            renderMessage(iObj);
            addToSession(iObj);
            showToast("✨ Image generated");
          } else {
            showTyping();
            const reply = await chatReply(msg);
            hideTyping();
            const bObj = { role: "bot", type: "text", content: reply };
            renderMessage(bObj);
            addToSession(bObj);
          }
        } catch (err) {
          dRow.remove();
          hideTyping();
          renderMessage({
            role: "bot",
            type: "text",
            content: "⚠️ Something went wrong. Please try again.",
          });
          showToast("Error occurred, please retry");
        }

        busy = false;
        document.getElementById("sendBtn").disabled = false;
        inp.focus();
        save();
      }

      /* ══════════════════════════════
   CLEAR
══════════════════════════════ */
      function clearChat() {
        if (!currentId) return;
        sessions[currentId].messages = [];
        save();
        const m = document.getElementById("messages");
        m.innerHTML = "";
        m.appendChild(buildWelcome());
        showToast("Conversation cleared");
      }

      /* ══════════════════════════════
   HELPERS
══════════════════════════════ */
      function scrollBottom() {
        const m = document.getElementById("messages");
        m.scrollTop = m.scrollHeight;
      }

      async function downloadImg(src) {
        showToast("Downloading…");
        try {
          const res = await fetch(src);
          const blob = await res.blob();
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "visiona-" + Date.now() + ".png";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast("✅ Saved!");
        } catch {
          window.open(src, "_blank");
          showToast("Opened in new tab");
        }
      }

      function openModal(src) {
        document.getElementById("modalImg").src = src;
        document.getElementById("imgModal").classList.add("open");
      }
      function closeModal() {
        document.getElementById("imgModal").classList.remove("open");
      }
      function escHtml(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      let toastT;
      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastT);
        toastT = setTimeout(() => t.classList.remove("show"), 2500);
      }

      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("open");
        document.getElementById("overlay").classList.toggle("show");
      }
      function closeSidebar() {
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("overlay").classList.remove("show");
      }

      const inp = document.getElementById("msgInput");
      inp.addEventListener("input", () => {
        inp.style.height = "auto";
        inp.style.height = Math.min(inp.scrollHeight, 160) + "px";
      });
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      inp.focus();
    </script>
  </body>
</html>
