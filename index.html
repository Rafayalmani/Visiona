<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Under Construction</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: #333;
    }

    .container {
      background: #fff;
      padding: 50px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 500px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
      color: #ff6600;
    }

    p {
      font-size: 18px;
      margin-bottom: 40px;
    }

    /* Construction Worker Animation */
    .worker {
      font-size: 60px;
      display: inline-block;
      position: relative;
      animation: moveWorker 3s infinite alternate ease-in-out;
    }

    @keyframes moveWorker {
      0% { transform: translateX(0); }
      50% { transform: translateX(50px); }
      100% { transform: translateX(0); }
    }

    /* Progress Bar */
    .progress-bar {
      width: 100%;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
      height: 20px;
      margin-top: 20px;
    }

    .progress {
      width: 0;
      height: 100%;
      background: #ff6600;
      animation: loading 3s infinite;
      border-radius: 20px 0 0 20px;
    }

    @keyframes loading {
      0% { width: 0; }
      50% { width: 80%; }
      100% { width: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="worker">👷‍♂️</div>
    <h1>Under Construction</h1>
    <p>Our website is on the way! 🚧<br>Please check back soon.</p>
    <div class="progress-bar">
      <div class="progress"></div>
    </div>
  </div>
</body>
</html>
